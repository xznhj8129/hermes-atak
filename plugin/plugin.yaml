name: atak-platform
label: ATAK / CoT
kind: platform
version: 1.3.0
description: >
  ATAK GeoChat messaging adapter for Hermes. Maintains a persistent
  mutual-TLS CoT stream, optionally publishes fresh multi-system MAVLink UAV
  locations through that same stream, reconciles OpenTAKServer-retained markers
  on demand, forwards inbound GeoChat to the normal Hermes gateway handler,
  sends the final response directly to the originating ATAK peer, and exposes
  persistent targeted MAVLink UAV control with asynchronous TAK feedback.
author: Local
optional_env:
  - name: ATAK_ALLOWED_USERS
    description: "Comma-separated ATAK sender UIDs allowed to message Hermes"
    prompt: "Allowed ATAK UIDs (comma-separated)"
    password: false
  - name: ATAK_ALLOW_ALL_USERS
    description: "Allow every mutually authenticated CoT sender (use with care)"
    prompt: "Allow all ATAK users? (true/false)"
    password: false
